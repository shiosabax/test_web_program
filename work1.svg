<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <!-- 背景 -->
  <rect width="1000" height="750" fill="#e5f0f2" />

  <!-- ブラウザウィンドウ本体 -->
  <rect x="90" y="105" width="820" height="555" rx="14" fill="#ffffff" filter="drop-shadow(0 14px 28px rgba(32, 60, 60, 0.08))" />

  <!-- ブラウザ上部バー -->
  <path d="M 90 119 Q 90 105 104 105 L 896 105 Q 910 105 910 119 L 910 165 L 90 165 Z" fill="#f0f5f6" />
  
  <!-- ウィンドウ操作ボタン (赤・黄・緑) -->
  <circle cx="130" cy="135" r="9" fill="#f27265" />
  <circle cx="158" cy="135" r="9" fill="#f7b738" />
  <circle cx="186" cy="135" r="9" fill="#58c98d" />

  <!-- アドレスバー風バー -->
  <rect x="215" y="123" width="480" height="24" rx="12" fill="#dfe9ec" />

  <!-- 上部：カフェヒーローバナー（エメラルドグリーン） -->
  <rect x="130" y="195" width="740" height="110" rx="12" fill="#008388" />
  
  <!-- 右側のコーヒーカップ＆スチーム風グラフィック装飾 -->
  <circle cx="790" cy="250" r="45" fill="#f7b738" opacity="0.4" />
  <!-- カップ本体 -->
  <path d="M 740 235 L 785 235 C 785 265 740 265 740 235 Z" fill="#ffffff" />
  <path d="M 785 240 C 795 240 795 255 785 255" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <!-- 湯気 -->
  <path d="M 750 225 Q 755 215 750 205" fill="none" stroke="#69c2c6" stroke-width="3" stroke-linecap="round" />
  <path d="M 765 225 Q 770 215 765 205" fill="none" stroke="#69c2c6" stroke-width="3" stroke-linecap="round" />

  <!-- ヒーロー内テキスト（タイトル＆サブテキスト） -->
  <rect x="160" y="220" width="80" height="14" rx="7" fill="#58c98d" />
  <rect x="160" y="244" width="320" height="22" rx="11" fill="#ffffff" />
  <rect x="160" y="276" width="220" height="12" rx="6" fill="#c3dfe2" />

  <!-- 下部：カフェニュース記事カード（3分割） -->

  <!-- 記事カード 1（左：新店・ロースタリー） -->
  <g transform="translate(130, 325)">
    <rect width="232" height="295" rx="12" fill="#f4f8f9" />
    
    <!-- ビジュアルエリア（コーヒー豆風アイコン） -->
    <rect x="14" y="14" width="204" height="120" rx="8" fill="#d2e5e7" />
    <ellipse cx="116" cy="74" rx="28" ry="36" fill="#008388" />
    <path d="M 116 42 Q 124 74 116 106" fill="none" stroke="#d2e5e7" stroke-width="3" stroke-linecap="round" />

    <!-- カテゴリタグ -->
    <rect x="16" y="148" width="55" height="18" rx="9" fill="#008388" />
    <rect x="25" y="154" width="37" height="6" rx="3" fill="#ffffff" />

    <!-- 記事タイトル & 抜粋テキスト -->
    <rect x="16" y="176" width="180" height="12" rx="6" fill="#008388" opacity="0.85" />
    <rect x="16" y="196" width="195" height="8" rx="4" fill="#cfdbe0" />
    <rect x="16" y="210" width="170" height="8" rx="4" fill="#cfdbe0" />

    <!-- 日付 & 保存マーク風 -->
    <rect x="16" y="258" width="60" height="8" rx="4" fill="#a7b9be" />
    <circle cx="202" cy="262" r="6" fill="#f7b738" />
  </g>

  <!-- 記事カード 2（中央：メニュー・スイーツ） -->
  <g transform="translate(384, 325)">
    <rect width="232" height="295" rx="12" fill="#f4f8f9" stroke="#b2d4d8" stroke-width="2" />
    
    <!-- ビジュアルエリア（アイスドリンク・トニック風） -->
    <rect x="14" y="14" width="204" height="120" rx="8" fill="#c3dfe2" />
    <!-- グラス -->
    <rect x="100" y="44" width="32" height="58" rx="4" fill="#ffffff" opacity="0.9" />
    <rect x="103" y="58" width="26" height="40" rx="2" fill="#008388" />
    <!-- レモンスライス風 -->
    <circle cx="128" cy="46" r="12" fill="#f7b738" />
    <circle cx="128" cy="46" r="8" fill="#ffffff" opacity="0.5" />

    <!-- カテゴリタグ -->
    <rect x="16" y="148" width="65" height="18" rx="9" fill="#f7b738" />
    <rect x="25" y="154" width="47" height="6" rx="3" fill="#ffffff" />

    <!-- 記事タイトル & 抜粋テキスト -->
    <rect x="16" y="176" width="190" height="12" rx="6" fill="#008388" opacity="0.85" />
    <rect x="16" y="196" width="195" height="8" rx="4" fill="#cfdbe0" />
    <rect x="16" y="210" width="150" height="8" rx="4" fill="#cfdbe0" />

    <!-- 日付 & 保存マーク風 -->
    <rect x="16" y="258" width="60" height="8" rx="4" fill="#a7b9be" />
    <circle cx="202" cy="262" r="6" fill="#008388" />
  </g>

  <!-- 記事カード 3（右：カルチャー・本と空間） -->
  <g transform="translate(638, 325)">
    <rect width="232" height="295" rx="12" fill="#f4f8f9" />
    
    <!-- ビジュアルエリア（本とマグカップ風） -->
    <rect x="14" y="14" width="204" height="120" rx="8" fill="#d2e5e7" />
    <!-- 開いた本 -->
    <path d="M 88 82 Q 102 76 116 82 Q 130 76 144 82 L 144 60 Q 130 54 116 60 Q 102 54 88 60 Z" fill="#008388" />
    <circle cx="152" cy="52" r="7" fill="#58c98d" />

    <!-- カテゴリタグ -->
    <rect x="16" y="148" width="70" height="18" rx="9" fill="#e2ebed" />
    <rect x="25" y="154" width="52" height="6" rx="3" fill="#889da4" />

    <!-- 記事タイトル & 抜粋テキスト -->
    <rect x="16" y="176" width="170" height="12" rx="6" fill="#008388" opacity="0.85" />
    <rect x="16" y="196" width="195" height="8" rx="4" fill="#cfdbe0" />
    <rect x="16" y="210" width="160" height="8" rx="4" fill="#cfdbe0" />

    <!-- 日付 & 保存マーク風 -->
    <rect x="16" y="258" width="60" height="8" rx="4" fill="#a7b9be" />
    <circle cx="202" cy="262" r="6" fill="#cfdbe0" />
  </g>
</svg>
