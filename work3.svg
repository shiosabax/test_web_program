<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <!-- 背景 -->
  <rect width="1000" height="750" fill="#e5f0f2" />

  <!-- ブラウザウィンドウ本体 -->
  <rect x="90" y="105" width="820" height="555" rx="14" fill="#ffffff" filter="drop-shadow(0 14px 28px rgba(32, 60, 60, 0.08))" />

  <!-- ブラウザ上部バー -->
  <path d="M 90 119 Q 90 105 104 105 L 896 105 Q 910 105 910 119 L 910 165 L 90 165 Z" fill="#f0f5f6" />
  
  <!-- ウィンドウ操作ボタン (赤・黄・緑) -->
  <circle cx="130" cy="135" r="9" fill="#f27265" />
  <circle cx="158" cy="135" r="9" fill="#f7b738" />
  <circle cx="186" cy="135" r="9" fill="#58c98d" />

  <!-- アドレスバー風バー -->
  <rect x="215" y="123" width="480" height="24" rx="12" fill="#dfe9ec" />

  <!-- メインヒーローエリア（イベントメインビジュアル） -->
  <rect x="130" y="195" width="740" height="200" rx="12" fill="#008388" />
  
  <!-- ヒーロー背景装飾（抽象的な幾何学・光） -->
  <circle cx="780" cy="240" r="75" fill="#69c2c6" opacity="0.35" />
  <circle cx="710" cy="330" r="50" fill="#58c98d" opacity="0.4" />
  <rect x="670" y="225" width="120" height="120" rx="16" fill="#f7b738" opacity="0.3" transform="rotate(25 730 285)" />

  <!-- イベントタグ（日付/カテゴリバッジ） -->
  <rect x="160" y="222" width="105" height="22" rx="11" fill="#f7b738" />
  <rect x="175" y="229" width="75" height="8" rx="4" fill="#ffffff" />

  <!-- イベントタイトル -->
  <rect x="160" y="256" width="380" height="26" rx="13" fill="#ffffff" />
  <rect x="160" y="292" width="260" height="14" rx="7" fill="#c3dfe2" />

  <!-- 申し込みCTAボタン -->
  <rect x="160" y="332" width="130" height="36" rx="18" fill="#ffffff" />
  <rect x="185" y="345" width="80" height="10" rx="5" fill="#008388" />

  <!-- 下部セクション（3カラム：登壇者/スケジュール/会場情報） -->

  <!-- カラム 1: スケジュール・概要 -->
  <g transform="translate(130, 420)">
    <rect width="232" height="195" rx="10" fill="#f4f8f9" />
    
    <!-- カレンダー風アイコンエリア -->
    <rect x="16" y="16" width="40" height="40" rx="8" fill="#d0ebeb" />
    <rect x="24" y="24" width="24" height="24" rx="4" fill="#008388" />

    <rect x="66" y="22" width="100" height="12" rx="6" fill="#a7b9be" />
    <rect x="66" y="38" width="70" height="10" rx="5" fill="#cfdbe0" />

    <!-- タイムラインバー -->
    <rect x="16" y="74" width="200" height="8" rx="4" fill="#dfe9ec" />
    <rect x="16" y="98" width="180" height="8" rx="4" fill="#dfe9ec" />
    <rect x="16" y="122" width="150" height="8" rx="4" fill="#dfe9ec" />
    <rect x="16" y="152" width="90" height="24" rx="12" fill="#d0ebeb" />
    <rect x="30" y="160" width="62" height="8" rx="4" fill="#008388" />
  </g>

  <!-- カラム 2: スピーカー/ゲスト -->
  <g transform="translate(384, 420)">
    <rect width="232" height="195" rx="10" fill="#f4f8f9" />
    
    <!-- アバター風アイコンエリア -->
    <circle cx="36" cy="36" r="20" fill="#008388" opacity="0.85" />
    <circle cx="36" cy="31" r="7" fill="#ffffff" />
    <path d="M 24 48 Q 36 38 48 48 Z" fill="#ffffff" />

    <rect x="66" y="22" width="90" height="12" rx="6" fill="#a7b9be" />
    <rect x="66" y="38" width="110" height="10" rx="5" fill="#cfdbe0" />

    <!-- プロフィール・説明テキストバー -->
    <rect x="16" y="74" width="200" height="8" rx="4" fill="#dfe9ec" />
    <rect x="16" y="94" width="190" height="8" rx="4" fill="#dfe9ec" />
    <rect x="16" y="114" width="140" height="8" rx="4" fill="#dfe9ec" />
    
    <!-- SNS/プロフィールリンクタグ -->
    <rect x="16" y="152" width="80" height="24" rx="12" fill="#e2ebed" />
    <rect x="28" y="160" width="56" height="8" rx="4" fill="#889da4" />
  </g>

  <!-- カラム 3: 会場/アクセス・参加枠 -->
  <g transform="translate(638, 420)">
    <rect width="232" height="195" rx="10" fill="#f4f8f9" />
    
    <!-- マップピン風アイコンエリア -->
    <rect x="16" y="16" width="40" height="40" rx="8" fill="#d0ebeb" />
    <circle cx="36" cy="32" r="7" fill="#f27265" />
    <polygon points="32,36 40,36 36,44" fill="#f27265" />

    <rect x="66" y="22" width="110" height="12" rx="6" fill="#a7b9be" />
    <rect x="66" y="38" width="60" height="10" rx="5" fill="#cfdbe0" />

    <!-- 詳細バー -->
    <rect x="16" y="74" width="200" height="8" rx="4" fill="#dfe9ec" />
    <rect x="16" y="94" width="170" height="8" rx="4" fill="#dfe9ec" />

    <!-- 残り枠・バッジ -->
    <rect x="16" y="120" width="110" height="16" rx="8" fill="#d9f0e1" />
    <rect x="26" y="125" width="90" height="6" rx="3" fill="#58c98d" />

    <rect x="16" y="152" width="90" height="24" rx="12" fill="#008388" />
    <rect x="28" y="160" width="66" height="8" rx="4" fill="#ffffff" />
  </g>
</svg>
