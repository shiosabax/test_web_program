<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <!-- 背景 -->
  <rect width="1000" height="750" fill="#e5f0f2" />

  <!-- ブラウザ/アプリウィンドウ本体 -->
  <rect x="90" y="105" width="820" height="555" rx="14" fill="#ffffff" filter="drop-shadow(0 14px 28px rgba(32, 60, 60, 0.08))" />

  <!-- ブラウザ上部バー -->
  <path d="M 90 119 Q 90 105 104 105 L 896 105 Q 910 105 910 119 L 910 165 L 90 165 Z" fill="#f0f5f6" />
  
  <!-- ウィンドウ操作ボタン (赤・黄・緑) -->
  <circle cx="130" cy="135" r="9" fill="#f27265" />
  <circle cx="158" cy="135" r="9" fill="#f7b738" />
  <circle cx="186" cy="135" r="9" fill="#58c98d" />

  <!-- アドレスバー風バー -->
  <rect x="215" y="123" width="480" height="24" rx="12" fill="#dfe9ec" />

  <!-- 上部：リフレクション・プロンプトカード（エメラルドグリーン） -->
  <rect x="130" y="195" width="740" height="110" rx="12" fill="#008388" />
  
  <!-- 背景装飾（やわらかな円形グラフィック） -->
  <circle cx="810" cy="235" r="55" fill="#69c2c6" opacity="0.3" />
  <circle cx="740" cy="275" r="35" fill="#58c98d" opacity="0.4" />

  <!-- プロンプトラベル・問いかけテキスト -->
  <rect x="160" y="220" width="110" height="14" rx="7" fill="#f7b738" />
  <rect x="160" y="244" width="340" height="20" rx="10" fill="#ffffff" />
  
  <!-- プロンプトアクションボタン -->
  <rect x="160" y="274" width="120" height="20" rx="10" fill="#ffffff" />
  <rect x="175" y="280" width="90" height="8" rx="4" fill="#008388" />

  <!-- 下部：ジャーナルエントリー一覧（3分割カード） -->

  <!-- エントリー 1（左：写真付きエントリー） -->
  <g transform="translate(130, 325)">
    <rect width="232" height="295" rx="12" fill="#f4f8f9" />
    
    <!-- 日付 & 気分スタンプ -->
    <rect x="16" y="16" width="70" height="10" rx="5" fill="#a7b9be" />
    <circle cx="204" cy="21" r="10" fill="#d0ebeb" />
    <circle cx="204" cy="21" r="5" fill="#008388" />

    <!-- 写真プレビューエリア -->
    <rect x="16" y="38" width="200" height="115" rx="8" fill="#c3dfe2" />
    <!-- 抽象風景（山と太陽） -->
    <circle cx="175" cy="65" r="12" fill="#f7b738" />
    <polygon points="40,153 90,95 140,153" fill="#008388" opacity="0.6" />
    <polygon points="100,153 145,110 190,153" fill="#008388" opacity="0.85" />

    <!-- テキストバー -->
    <rect x="16" y="168" width="180" height="10" rx="5" fill="#cfdbe0" />
    <rect x="16" y="186" width="195" height="10" rx="5" fill="#cfdbe0" />
    <rect x="16" y="204" width="130" height="10" rx="5" fill="#cfdbe0" />

    <!-- タグ -->
    <rect x="16" y="250" width="60" height="20" rx="10" fill="#e2ebed" />
    <rect x="26" y="256" width="40" height="8" rx="4" fill="#889da4" />
  </g>

  <!-- エントリー 2（中央：テキスト中心のハイライトエントリー） -->
  <g transform="translate(384, 325)">
    <rect width="232" height="295" rx="12" fill="#f4f8f9" stroke="#b2d4d8" stroke-width="2" />
    
    <!-- 日付 & 気分スタンプ -->
    <rect x="16" y="16" width="85" height="10" rx="5" fill="#008388" opacity="0.7" />
    <circle cx="204" cy="21" r="10" fill="#f7b738" />

    <!-- 引用・見出し風太線 -->
    <rect x="16" y="44" width="170" height="14" rx="7" fill="#008388" opacity="0.9" />
    <rect x="16" y="66" width="130" height="14" rx="7" fill="#008388" opacity="0.9" />

    <!-- 本文テキストバー -->
    <rect x="16" y="100" width="195" height="10" rx="5" fill="#cfdbe0" />
    <rect x="16" y="118" width="185" height="10" rx="5" fill="#cfdbe0" />
    <rect x="16" y="136" width="195" height="10" rx="5" fill="#cfdbe0" />
    <rect x="16" y="154" width="160" height="10" rx="5" fill="#cfdbe0" />
    <rect x="16" y="172" width="140" height="10" rx="5" fill="#cfdbe0" />

    <!-- タグ -->
    <rect x="16" y="250" width="70" height="20" rx="10" fill="#d0ebeb" />
    <rect x="26" y="256" width="50" height="8" rx="4" fill="#008388" />
  </g>

  <!-- エントリー 3（右：メモ・アイデア風エントリー） -->
  <g transform="translate(638, 325)">
    <rect width="232" height="295" rx="12" fill="#f4f8f9" />
    
    <!-- 日付 & 気分スタンプ -->
    <rect x="16" y="16" width="70" height="10" rx="5" fill="#a7b9be" />
    <circle cx="204" cy="21" r="10" fill="#d0ebeb" />
    <circle cx="204" cy="21" r="5" fill="#58c98d" />

    <!-- チェックリスト/箇条書き風グラフィック -->
    <g transform="translate(16, 44)">
      <circle cx="6" cy="6" r="6" fill="#008388" />
      <rect x="22" y="1" width="160" height="10" rx="5" fill="#cfdbe0" />

      <circle cx="6" cy="30" r="6" fill="#008388" />
      <rect x="22" y="25" width="140" height="10" rx="5" fill="#cfdbe0" />

      <circle cx="6" cy="54" r="6" fill="#008388" />
      <rect x="22" y="49" width="170" height="10" rx="5" fill="#cfdbe0" />

      <circle cx="6" cy="78" r="6" fill="#dfe9ec" />
      <rect x="22" y="73" width="130" height="10" rx="5" fill="#dfe9ec" />
    </g>

    <rect x="16" y="148" width="190" height="10" rx="5" fill="#cfdbe0" />
    <rect x="16" y="166" width="150" height="10" rx="5" fill="#cfdbe0" />

    <!-- タグ -->
    <rect x="16" y="250" width="60" height="20" rx="10" fill="#e2ebed" />
    <rect x="26" y="256" width="40" height="8" rx="4" fill="#889da4" />
  </g>

  <!-- フローティング追加ボタン（FAB：エメラルドグリーンの「＋」ボタン） -->
  <g transform="translate(475, 580)" filter="drop-shadow(0 6px 12px rgba(0, 131, 136, 0.35))">
    <circle cx="25" cy="25" r="26" fill="#008388" />
    <!-- プラスマーク -->
    <rect x="22" y="13" width="6" height="24" rx="3" fill="#ffffff" />
    <rect x="13" y="22" width="24" height="6" rx="3" fill="#ffffff" />
  </g>
</svg>
